version: "3.9"

# Postgres is NOT defined here — all DClaw apps share the one local Postgres in
# ../dclaw-local-db (started by ../dclaw-up.sh). This app uses database dclaw_seo
# on that shared server, reached over the external "dclaw-net" network.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@dclaw-postgres:5432/dclaw_seo
      APP_ENV: production
      # Default LLM points at a host-run Ollama (override anytime in Settings).
      LLM_PROVIDER: auto
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8095:8095"
    networks:
      - dclaw-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8095
    environment:
      PORT: 3006
    ports:
      - "3006:3006"
    networks:
      - dclaw-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dclaw-net:
    external: true
