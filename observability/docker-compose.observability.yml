# Observability stack for DClaw SEO (H.4).
#
#   docker compose -f observability/docker-compose.observability.yml up -d
#
# Prometheus scrapes the backend's /metrics (host.docker.internal:8095) and
# Grafana auto-provisions a Prometheus datasource + the DClaw SEO dashboard.
# Grafana: http://localhost:3030 (admin/admin). Prometheus: http://localhost:9090.
services:
  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
