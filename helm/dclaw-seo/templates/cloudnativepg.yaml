{{- if .Values.postgresql.enabled -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-db
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: {{ .Values.postgresql.storage }}
  bootstrap:
    initdb:
      database: {{ .Values.postgresql.database }}
      owner: {{ .Values.postgresql.username }}
      # Use the chart-managed credentials so the app's DATABASE_URL matches.
      secret:
        name: {{ include "dclaw-seo.fullname" . }}-db-creds
{{- end }}
