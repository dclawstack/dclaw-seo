apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-backend
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dclaw-seo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "dclaw-seo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.backend.port }}"
    spec:
      serviceAccountName: {{ include "dclaw-seo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.backend.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.config.llmProvider | quote }}
            - name: OLLAMA_URL
              value: {{ .Values.config.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollamaModel | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dclaw-seo.fullname" . }}-db-creds
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dclaw-seo.fullname" . }}-db-creds
                  key: password
            # Assembled from the CNPG read-write service + db creds.
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@{{ include "dclaw-seo.fullname" . }}-db-rw:5432/{{ .Values.postgresql.database }}"
          envFrom:
            - secretRef:
                name: {{ include "dclaw-seo.fullname" . }}-env
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
