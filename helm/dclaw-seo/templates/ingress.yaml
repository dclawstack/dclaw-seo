{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dclaw-seo.fullname" . }}
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API + health/metrics → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dclaw-seo.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "dclaw-seo.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backendPort }}
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.frontend.enabled }}
                name: {{ include "dclaw-seo.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
                {{- else }}
                name: {{ include "dclaw-seo.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backendPort }}
                {{- end }}
{{- end }}
