{{- /* App env secret (JWT signing key + optional 3rd-party keys). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-env
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  STRIPE_API_KEY: {{ .Values.secrets.stripeApiKey | quote }}
  PAGESPEED_API_KEY: {{ .Values.secrets.pagespeedApiKey | quote }}
  GBP_API_KEY: {{ .Values.secrets.gbpApiKey | quote }}
---
{{- /* DB credentials used both by CloudNativePG and the app DATABASE_URL. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-db-creds
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ .Values.postgresql.password | quote }}
