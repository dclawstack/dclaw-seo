apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-backend
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dclaw-seo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-seo.fullname" . }}-frontend
  labels:
    {{- include "dclaw-seo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dclaw-seo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
