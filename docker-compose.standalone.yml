version: "3.9"

# Self-contained stack — bundles its own Postgres so the app runs with ONE
# command and no external setup:
#
#   docker compose -f docker-compose.standalone.yml up
#
# Postgres is internal-only (not published to the host), so multiple DClaw
# apps can run at the same time without colliding on 5432. App at
# http://localhost:3006 (frontend) / http://localhost:8095 (backend).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: dclaw
      POSTGRES_DB: dclaw_seo
    volumes:
      - seo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclaw -d dclaw_seo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@postgres:5432/dclaw_seo
      APP_ENV: production
      # Default LLM points at a host-run Ollama (override anytime in Settings).
      LLM_PROVIDER: auto
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8095
    environment:
      PORT: 3006
    ports:
      - "3006:3006"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  seo_pgdata:
